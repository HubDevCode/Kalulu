name: Release

# Pushing a tag such as v2.5.0 builds the AppImage and publishes it with its
# SHA256SUMS. The updater of Kalulu installs only a download that matches it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  appimage:
    # The oldest supported Ubuntu: the AppImage needs a glibc at least this old.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libasound2-dev libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev libflac-dev libvorbis-dev libogg-dev libmpg123-dev file
      - name: Get appimagetool
        run: |
          curl -fsSLo "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Build the AppImage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: "1"
          VERSION: ${{ github.ref_name }}
        run: sh packaging/appimage/build.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="build/appimage/Kalulu-*.AppImage build/appimage/SHA256SUMS"
          # A tag moved to a fixed commit replaces the files of its release.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            # packaging/release-notes/<tag>.md, when present, is the description.
            notes="packaging/release-notes/$GITHUB_REF_NAME.md"
            if [ -f "$notes" ]; then
              gh release create "$GITHUB_REF_NAME" --title "Kalulu ${GITHUB_REF_NAME#v}" --notes-file "$notes" $files
            else
              gh release create "$GITHUB_REF_NAME" --title "Kalulu ${GITHUB_REF_NAME#v}" --generate-notes $files
            fi
          fi
